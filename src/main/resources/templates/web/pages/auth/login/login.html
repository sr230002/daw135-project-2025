<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 100px;
        }

        .message {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="text-center mb-4">
            <h1 class="h3 mb-3 font-weight-normal">DAW135</h1>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow">
            <div class="card-body text-center">
                <h5 class="card-title mb-4">Iniciar sesión</h5>
                <a th:href="@{/oauth2/authorization/auth0}" class="btn btn-primary btn-lg">
                    <i class="bi bi-person-circle me-2"></i> Login with Auth0
                </a>
            </div>
        </div>
    </div>
</body>

</html>
