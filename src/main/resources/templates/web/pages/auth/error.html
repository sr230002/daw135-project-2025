<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Sistema | DAW135</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f2f5 0%, #e0e0e0 100%);
        }
        .error-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 550px;
            width: 100%;
        }
        .error-header {
            background: linear-gradient(135deg, #6c757d 0%, #343a40 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .error-body {
            padding: 2rem;
            background-color: white;
        }
        .error-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: shake 1.5s infinite;
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .btn-custom {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-header">
                <i class="bi bi-exclamation-triangle-fill error-icon"></i>
                <h1 class="h2 mb-0">¡Algo salió mal!</h1>
            </div>
            <div class="error-body text-center">
                <h3 class="h4 text-dark mb-3" th:text="'Código de error: ' + ${codigo}">Error desconocido</h3>
                <p class="text-muted mb-4" th:text="${mensaje}">
                    Se ha producido un error inesperado. Por favor, vuelve a intentarlo más tarde o contacta con soporte técnico.
                </p>
                
                <div class="d-grid gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-secondary btn-custom">
                        <i class="bi bi-arrow-left-circle me-2"></i> Volver al inicio
                    </a>
                </div>

                <hr class="my-4">
                
                <p class="small text-muted mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    Si el problema persiste, reporta este error a los administradores.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
