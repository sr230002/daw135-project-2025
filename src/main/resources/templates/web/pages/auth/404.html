<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada | DAW135</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .notfound-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f2f5 0%, #e2e6ea 100%);
        }
        .notfound-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        .notfound-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .notfound-body {
            padding: 2rem;
            background-color: white;
        }
        .notfound-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .btn-custom {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="notfound-container">
        <div class="notfound-card">
            <div class="notfound-header">
                <i class="bi bi-exclamation-triangle-fill notfound-icon"></i>
                <h1 class="h2 mb-0">Página No Encontrada</h1>
            </div>
            <div class="notfound-body text-center">
                <h3 class="h4 text-dark mb-3">Error 404</h3>
                <p class="text-muted mb-4">
                    Lo sentimos, no hemos encontrado la página que estás buscando.<br>
                    Puede que la URL esté escrita incorrectamente o que el recurso ya no exista.
                </p>
                
                <div class="d-grid gap-2">
                    <a th:href="@{/}" class="btn btn-primary btn-custom">
                        <i class="bi bi-house-door me-2"></i> Regresar
                    </a>
                </div>
                
                <hr class="my-4">
                
                <p class="small text-muted mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    Código de error: <span class="fw-bold">404-Not Found</span>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
