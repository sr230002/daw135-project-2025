<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado | DAW135</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .denied-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .denied-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }
        .denied-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .denied-body {
            padding: 2rem;
            background-color: white;
        }
        .denied-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .btn-custom {
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="denied-container">
        <div class="denied-card">
            <div class="denied-header">
                <i class="bi bi-shield-lock-fill denied-icon"></i>
                <h1 class="h2 mb-0">Acceso Restringido</h1>
            </div>
            <div class="denied-body text-center">
                <h3 class="h4 text-dark mb-3">No tienes permisos suficientes</h3>
                <p class="text-muted mb-4">
                    Lo sentimos, pero tu cuenta no tiene los privilegios necesarios para acceder a este recurso.
                    Si crees que esto es un error, por favor contacta al equipo de soporte.
                </p>
                
                <div class="d-grid gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-primary btn-custom">
                        <i class="bi bi-house-door me-2"></i> Regresar
                    </a>
                </div>
                
                <hr class="my-4">
                
                <p class="small text-muted mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    Código de error: <span class="fw-bold">403-Forbidden</span>
                </p>
            </div>
        </div>
    </div>

    
</body>
</html>
