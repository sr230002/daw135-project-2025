<div th:fragment="formulario">
    <div class="modal fade" id="eventoModal" tabindex="-1" aria-labelledby="eventoModalLabel" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg rounded-4" style="height: 75vh;">
                <div class="modal-header bg-gradient bg-primary text-white rounded-top-4">
                    <h5 class="modal-title fw-bold" id="eventoModalLabel">Reserva tu Evento</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <form id="eventoForm" th:action="@{/eventos/guardar}" th:object="${evento}" method="post"
                    enctype="multipart/form-data">
                    <input type="hidden" id="eventoId" name="eventoId" th:value="*{eventoId}">
                    <input type="hidden" id="estadoId" name="estadoId" th:value="*{estadoId}">
                    <input type="hidden" id="fechaCreacion" name="fechaCreacion" th:value="*{fechaCreacion}">

                    <div class="modal-body overflow-auto px-4 py-3" style="max-height: calc(75vh - 130px);">

                        <!-- Información Básica -->
                        <h6 class="mb-3 text-secondary fw-semibold border-bottom pb-2">Información Básica</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="codigo" class="form-label">Código del Evento</label>
                                <input type="text" class="form-control shadow-sm" id="codigo" name="codigo"
                                    th:value="*{codigo}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="tipoEventoId" class="form-label">Tipo de Evento</label>
                                <select class="form-select shadow-sm" id="tipoEventoId" name="tipoEventoId"
                                    th:value="*{tipoEventoId}" required>
                                    <option value="">Seleccione un tipo</option>
                                    <option th:each="tipo : ${listTiposEventos}" th:value="${tipo.tipoEventoId}"
                                        th:text="${tipo.descripcion}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="sedeId" class="form-label">Sede</label>
                                <select class="form-select shadow-sm" id="sedeId" name="sedeId" th:value="*{sedeId}"
                                    required>
                                    <option value="">Seleccione una sede</option>
                                    <option th:each="sede : ${listSedes}" th:value="${sede.sedeId}"
                                        th:text="${sede.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
                                <input type="date" class="form-control shadow-sm" id="fechaInicio" name="fechaInicio"
                                    th:value="*{fechaInicio}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fechaFin" class="form-label">Fecha de Finalización</label>
                                <input type="date" class="form-control shadow-sm" id="fechaFin" name="fechaFin"
                                    th:value="*{fechaFin}" required>
                            </div>
                        </div>

                        <!-- Detalles del Evento -->
                        <h6 class="mb-3 text-secondary fw-semibold border-bottom pb-2">Detalles del Evento</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="titulo" class="form-label">Título del Evento</label>
                                <input type="text" class="form-control shadow-sm" id="titulo" name="titulo"
                                    th:value="*{titulo}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="descripcionCorta" class="form-label">Descripción Corta</label>
                                <input type="text" class="form-control shadow-sm" id="descripcionCorta"
                                    name="descripcionCorta" th:value="*{descripcionCorta}">
                            </div>
                            <div class="col-12">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control shadow-sm" id="descripcion" name="descripcion" rows="3"
                                    th:text="*{descripcion}" required></textarea>
                            </div>
                            <div class="col-12">
                                <label for="imagen" class="form-label">Imagen del Evento</label>
                                <input type="file" class="form-control shadow-sm" id="imagen" name="imagen"
                                    accept="image/*">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="imagenActual" class="form-label">Imagen actual:</label>
                            <div id="imagenPreview" class="mb-2">
                                <!-- aquí se carga la imagen actual (si hay) -->
                            </div>
                            <label for="imagenNueva" class="form-label">Cambiar imagen:</label>
                            <input class="form-control" type="file" id="imagenNueva" name="imagenNueva"
                                accept="image/*">
                        </div>
                    </div>

                    <div class="modal-footer bg-light rounded-bottom-4 py-3">
                        <button type="button" class="btn btn-outline-secondary px-4"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
