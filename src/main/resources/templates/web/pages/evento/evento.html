<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/document}">
<head>
    <title>Administración de Eventos</title>
    <style>
        .table img {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .btn-action {
            margin: 0 2px;
        }
    </style>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener("DOMContentLoaded", function () {
            let mensaje = /*[[${msj}]]*/ null;
            if (mensaje) {
                mostrarToast(mensaje, 'success');
            }
        });
        /*]]>*/
    </script>
</head>
<body>
    <div layout:fragment="content">
        <div class="container mt-4">

            <!-- Cabecera -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 text-primary">
                    <i class="bi bi-calendar-event-fill me-2"></i> Administración de Eventos
                </h1>
                <button class="btn btn-primary" onclick="mostrarFormulario()">
                    <i class="bi bi-plus-circle me-1"></i> Crear Evento
                </button>
            </div>

            <!-- Tabla de eventos -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Listado de Eventos</h5>
                    <small class="text-white-50" th:text="'Total: ' + ${eventosTotales}">Total: 0</small>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Imagen</th>
                                    <th>Código</th>
                                    <th>Título</th>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="evento, iterStat : ${listadoEventos}">
                                    <td th:text="${iterStat.index + 1}">1</td>
                                    <td>
                                        <img th:src="${evento.urlImagen != null} ? ${evento.urlImagen} : 'https://www.laprensagrafica.com/__export/1716568650267/sites/prensagrafica/img/2024/05/24/doge.png_1758632411.png'" 
                                             alt="img evento" />
                                    </td>
                                    <td th:text="${evento.codigo}">EVT001</td>
                                    <td>
                                        <div class="fw-bold" th:text="${evento.titulo}">Nombre del Evento</div>
                                        <div class="text-muted small" th:text="${evento.descripcionCorta}">Descripción corta</div>
                                    </td>
                                    <td th:text="${evento.fechaInicio}">Inicio</td>
                                    <td th:text="${evento.fechaFin}">Fin</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="
                                                ${evento.estado == 'Activo'} ? ' bg-success' :
                                                (${evento.estado == 'Finalizado'} ? ' bg-secondary' :
                                                (${evento.estado == 'Cancelado'} ? ' bg-danger' : ' bg-warning'))
                                              "
                                              th:text="${evento.estado}">Estado</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-info btn-sm btn-action"
                                                th:attr="onclick=|cargarEvento(${evento.eventoId})|">
                                            <i class="bi bi-pencil-fill"></i>
                                        </button>
                                        <a th:href="|eventos/eliminar/${evento.eventoId}|"
                                           class="btn btn-danger btn-sm btn-action"
                                           onclick="showLoading();">
                                            <i class="bi bi-trash-fill"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listadoEventos)}">
                                    <td colspan="8" class="text-center text-muted py-4">
                                        <i class="bi bi-calendar-x fs-1"></i>
                                        <div class="mt-2">No hay eventos registrados.</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal para crear evento -->
            <div th:replace="~{pages/evento/eventoForm :: formulario}"></div>
            <script th:src="@{/js/evento/evento.js}"></script>

        </div>
    </div>
</body>
</html>
