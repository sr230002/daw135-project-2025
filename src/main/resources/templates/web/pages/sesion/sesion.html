                </button>
            </div>

            <!-- Tabla de sesiones -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Sesiones Programadas</h5>
                        <div class="text-white small"
                            th:text="'Total: ' + ${#lists.size(listadoSesiones)} + ' sesiones'"></div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" id="tablaSesiones">
                            <thead class="table-dark">
                                <tr>
                                    <th class="text-center">#</th>
                                    <th class="text-center">Evento</th>
                                    <th class="text-center">Fecha</th>
                                    <th class="text-center">Horario</th>
                                    <th class="text-center">Ponente</th>
                                    <th class="text-center">Modalidad</th>
                                    <th class="text-center">Cupos</th>
                                    <th class="text-center">Inscritos</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sesion, iterStat : ${listadoSesiones}">
                                    <td th:text="${iterStat.index + 1}">1</td>
                                    <td th:text="${sesion.eventoTitulo}">Evento</td>
                                    <td class="text-center"
                                        th:text="${#temporals.format(sesion.fechaProgramacion, 'dd/MM/yyyy')}">
                                        01/01/2023</td>
                                    <td class="text-center"
                                        th:text="${#temporals.format(sesion.horaInicio, 'HH:mm')} + ' - ' + ${#temporals.format(sesion.horaFin, 'HH:mm')}">
                                        08:00 - 10:00</td>
                                    <td th:text="${sesion.ponenteNombre}">Ponente</td>
                                    <td class="text-center">
                                        <span th:if="${sesion.virtual}" class="badge bg-info">Virtual</span>
                                        <span th:unless="${sesion.virtual}" class="badge bg-success">Presencial</span>
                                    </td>
                                    <td class="text-center" th:text="${sesion.cupos}">50</td>
                                    <!-- <td class="text-center" th:text="${sesion.numeroInscritos != null ? sesion.numeroInscritos : 0}">25</td> -->
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <button class="btn btn-sm btn-info"
                                                th:attr="onclick=|cargarSesion(${sesion.eventoProgramacionId})|">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger"
                                                th:attr="onclick=|eliminarSesion(${sesion.eventoProgramacionId})|">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listadoSesiones)}">
                                    <td colspan="9" class="text-center">No hay sesiones programadas.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal para crear/editar sesión -->
            <div th:replace="~{pages/sesion/sesionForm :: formulario}"></div>
            <script th:src="@{/js/evento/sesion.js}"></script>
        </div>
    </div>
</body>

</html>
