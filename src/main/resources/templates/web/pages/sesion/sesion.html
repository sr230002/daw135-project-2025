<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/document}">

<head>
    <title>Administración de Sesiones</title>
    <style>
        .btn-action {
            margin: 0 2px;
        }
    </style>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener("DOMContentLoaded", function () {
            let mensaje = /*[[${msj}]]*/ null;
            if (mensaje) {
                mostrarToast(mensaje, 'success');
            }
        });
        /*]]>*/
    </script>
</head>

<body>
    <div layout:fragment="content">
        <div class="container mt-4">

            <!-- Cabecera -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 text-primary">
                    <i class="bi bi-easel-fill me-2"></i> Administración de Sesiones
                </h1>
                <button class="btn btn-primary" onclick="mostrarFormulario()">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Sesión
                </button>
            </div>

            <!-- Tabla de sesiones -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Listado de Sesiones</h5>
                    <small class="text-white" th:text="'Total: ' + ${listadoSesiones.size()}">Total: 0</small>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Evento</th>
                                    <th>Fecha</th>
                                    <th>Horario</th>
                                    <th>Ponente</th>
                                    <th>Modalidad</th>
                                    <th>Lugar / Enlace</th>
                                    <th>Cupos</th>
                                    <th>Inscritos</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sesion, iterStat : ${listadoSesiones}">
                                    <td th:text="${iterStat.index + 1}">1</td>
                                    <td th:text="${sesion.eventoTitulo}">Evento</td>
                                    <td th:text="${sesion.fechaProgramacion}">01/01/2023</td>
                                    <td th:text="${sesion.horaInicio} + ' - ' + ${sesion.horaFin}">08:00 - 10:00</td>
                                    <td th:text="${sesion.ponenteNombre}">Ponente</td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${sesion.virtual} ? ' bg-info' : ' bg-success'"
                                            th:text="${sesion.virtual} ? 'Virtual' : 'Presencial'">
                                            Modalidad
                                        </span>
                                    </td>
                                    <td th:text="${sesion.virtual} ? ${sesion.enlace} : ${sesion.lugar}">Lugar
                                    </td>
                                    <td th:text="${sesion.cupos}">0</td>
                                    <!-- Inscritos (pendiente corregir ) -->
                                    <td th:text="${sesion.cupos}">0</td>
                                    <td>
                                        <div class="d-flex">
                                            <button class="btn btn-info btn-sm btn-action"
                                                th:attr="onclick=|cargarSesion(${sesion.eventoProgramacionId})|">
                                                <i class="bi bi-pencil-fill"></i>
                                            </button>
                                            <a th:href="|sesiones/eliminar/${sesion.eventoProgramacionId}|"
                                                class="btn btn-danger btn-sm btn-action" onclick="showLoading();">
                                                <i class="bi bi-trash-fill"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listadoSesiones)}">
                                    <td colspan="10" class="text-center text-muted py-4">
                                        <i class="bi bi-calendar-x fs-1"></i>
                                        <div class="mt-2">No hay sesiones registradas.</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal formulario -->
            <div th:replace="~{pages/sesion/sesionForm :: formulario}"></div>

            <!-- JS de sesiones -->
            <script th:src="@{/js/evento/sesion.js}"></script>

        </div>
    </div>
</body>

</html>
