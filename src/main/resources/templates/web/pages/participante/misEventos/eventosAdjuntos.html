<!-- Fragmento para mostrar los anexos -->
<div th:fragment="eventosAdjuntos" class="anexos-tab-content">
    <style>
        .attachments-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .attachment-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .attachment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .attachment-preview {
            height: 160px;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .attachment-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .attachment-icon {
            font-size: 3rem;
            color: #6c757d;
        }

        .attachment-body {
            padding: 1rem;
            flex-grow: 1;
        }

        .attachment-title {
            font-weight: 500;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attachment-desc {
            color: #6c757d;
            font-size: 0.875rem;
            display: -webkit-box;
            /* -webkit-line-clamp: 2; */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .attachment-actions {
            padding: 0.75rem;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            background-color: #f8f9fa;
        }

        .add-attachment-btn {
            margin-bottom: 1.5rem;
        }

        .file-type-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
    </style>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="card-title mb-0">
            <i class="bi bi-paperclip text-secondary me-2"></i>Anexos
        </h3>
        <button 
            class="btn btn-primary btn-sm add-attachment-btn" data-bs-toggle="modal"
            data-bs-target="#addAttachmentModal"
            sec:authorize="hasRole('PONENTE') or hasRole('ADMIN')"
        >
            <i class="bi bi-plus-circle me-1"></i> Agregar
        </button>
    </div>

    <div th:if="${evento.adjuntos == null or evento.adjuntos.empty}" class="alert alert-info">
        No hay anexos disponibles para este evento.
    </div>

    <div class="attachments-container" th:unless="${evento.adjuntos == null or evento.adjuntos.empty}">
        <div class="attachment-card" th:each="adjunto : ${evento.adjuntos}">

            <!-- PREVIEW (sólo imagen con preview visible) -->
            <a th:if="${adjunto.tipo == 'imagen'}" th:href="${adjunto.url}" target="_blank" class="attachment-preview">
                <img th:src="${adjunto.url}" th:alt="${adjunto.nombre}">
            </a>

            <!-- PREVIEW (otros tipos, ícono que llama JS para abrir en pestaña) -->
            <a th:if="${adjunto.tipo != 'imagen'}" href="javascript:void(0);"
                th:attr="data-url=${adjunto.url}, data-nombre=${adjunto.nombre}, data-tipo=${adjunto.tipo}"
                onclick="abrirArchivo(this)" class="attachment-preview">
                <i class="bi bi-file-earmark-fill attachment-icon"></i>
                <span class="file-type-badge" th:text="${adjunto.tipo}"></span>
            </a>

            <div class="attachment-body">
                <h6 class="attachment-title" th:text="${adjunto.nombre}">Nombre del archivo</h6>
                <p class="attachment-desc" th:text="${adjunto.descripcion} ?: 'Sin descripción'">Descripción del archivo
                </p>
            </div>

            <div class="attachment-actions" sec:authorize="hasRole('PONENTE') or hasRole('ADMIN')">
                <button class="btn btn-sm btn-outline-danger delete-attachment" th:data-id="${adjunto.eventoAdjuntoId}"
                    th:onclick="|eliminarAdjuntoModal(${adjunto.eventoAdjuntoId})|" id="confirmAdjuntoDeletion">
                    <i class="bi bi-trash"></i> Eliminar
                </button>
            </div>

        </div>
    </div>

    <!-- Modal para agregar nuevo adjunto -->
    <div class="modal fade" id="addAttachmentModal" tabindex="-1" aria-labelledby="addAttachmentModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addAttachmentModalLabel">Agregar Anexo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="uploadAttachmentForm" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="attachmentFile" class="form-label">Archivo</label>
                            <input class="form-control" type="file" id="attachmentFile" name="file" required>
                        </div>

                        <div class="mb-3">
                            <label for="attachmentDescription" class="form-label">Descripción (opcional)</label>
                            <textarea class="form-control" id="attachmentDescription" name="descripcion"
                                rows="3"></textarea>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="attachmentVisible" name="visible"
                                checked>
                            <label class="form-check-label" for="attachmentVisible">Visible para
                                participantes</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="submitAttachment"
                        th:onclick="|subirAdjuntoModal(${evento.eventoId})|">
                        Subir
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
