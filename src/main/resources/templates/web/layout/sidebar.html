<aside th:fragment="sidebar(user)" class="sidebar bg-dark text-white p-3">
    <!-- Sección de usuario -->
    <div class="text-center mb-4" th:if="${user}">
        <img th:if="${user.attributes?.picture}" th:src="${user.attributes.picture}" 
             alt="Foto de perfil" width="64" height="64" class="rounded-circle mb-2">
        <h6 th:text="${user.attributes?.name}">Nombre Usuario</h6>
        <small class="text-muted" th:text="${user.attributes?.email}">email@ejemplo.com</small>
    </div>

    <hr class="my-2">

    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/dashboard}">
                <i class="bi bi-house-door me-2"></i> Inicio
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/eventos}">
                <i class="bi bi-card-checklist me-2"></i> Eventos
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/sesiones}">
                <i class="bi bi-camera-video-fill me-2"></i> Sesiones
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/registros}">
                <i class="bi bi-people me-2"></i> Participantes
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" th:href="@{/dashboard}">
                <i class="bi bi-gear me-2"></i> Configuración
            </a>
        </li>
    </ul>
</aside>
